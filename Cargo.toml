[package]
name = "ccsds-ethernet-client"
version = "0.3.1"
edition = "2024"
rust-version = "1.85"
authors = ["Ian Cleary <iancleary@hey.com>"]
description = "Typed in-process CCSDS raw-Ethernet client"
license = "MIT"
readme = "README.md"
repository = "https://github.com/iancleary/ccsds-ethernet-client"
publish = true

[lib]
crate-type = ["rlib", "cdylib"]

[features]
python = ["dep:pyo3", "pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.29.2", optional = true, features = ["abi3-py311"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.189"
