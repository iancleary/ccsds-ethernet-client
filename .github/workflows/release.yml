name: Release packages

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Use Rust stable
        run: rustup update stable && rustup default stable
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.51.0"
      - name: Verify release tag and packages
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          test "$RELEASE_TAG" = "v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          cargo fmt --check
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
          PYO3_NO_PYTHON=1 cargo clippy --locked --features python --all-targets -- -D warnings
          uv run --python 3.11 --isolated --no-project --with maturin==1.11.5 bash -euc '
            maturin develop --locked
            python -m unittest discover -s python/tests -v
          '
          uv run scripts/test_cut_release.py
          uv run scripts/test_release_workflow.py
          cargo package --locked

  build-python-wheels:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build Python wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: "2_28"
          maturin-version: v1.11.5
          args: --release --locked --compatibility pypi --out dist
      - name: Store Python wheel
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: python-wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  build-python-sdist:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build Python source distribution
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          maturin-version: v1.11.5
          args: --out dist
      - name: Store Python source distribution
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: python-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish-crate:
    needs: [verify, build-python-wheels, build-python-sdist]
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Use Rust stable
        run: rustup update stable && rustup default stable
      - name: Publish crate
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-pypi:
    needs: publish-crate
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ccsds-ethernet-client
    permissions:
      id-token: write
    steps:
      - name: Retrieve Python distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: python-*
          path: dist
          merge-multiple: true
      - name: Publish Python distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
