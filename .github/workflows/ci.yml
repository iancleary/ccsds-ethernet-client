name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  parser-fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install bounded fuzz toolchain
        run: |
          rustup toolchain install nightly-2026-09-07 --profile minimal
          cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz arbitrary and structured frames
        run: cargo +nightly-2026-09-07 fuzz run frames -- -max_len=2048 -max_total_time=30
      - name: Retain failure reproductions
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: parser-fuzz-failures
          path: fuzz/artifacts/
          if-no-files-found: ignore

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify declared minimum Rust version
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          cargo +1.85.0 check --locked --all-targets
          PYO3_NO_PYTHON=1 cargo +1.85.0 check --locked --features python --all-targets

  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Use Rust stable
        run: rustup update stable && rustup default stable
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.51.0"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run tests
        run: |
          cargo test --locked --all-targets
          cargo test --locked --doc
      - name: Test Linux packet sockets in isolation
        run: |
          just linux-test
          just linux-benchmark-check
      - name: Check Python bindings
        run: |
          PYO3_NO_PYTHON=1 cargo clippy --locked --features python --all-targets -- -D warnings
          uv run --managed-python --python 3.11 --isolated --no-project --with maturin==1.11.5 bash -euc '
            maturin develop --locked
            python -m unittest discover -s python/tests -v
          '
      - name: Run release contract tests
        run: |
          uv run --managed-python --python 3.11 scripts/test_cut_release.py
          uv run --managed-python --python 3.11 scripts/test_release_workflow.py
          uv run --managed-python --python 3.11 scripts/test_task_runtime.py
      - name: Check documentation
        run: PYO3_NO_PYTHON=1 RUSTDOCFLAGS="-D warnings" cargo doc --all-features --no-deps
      - name: Verify package
        run: cargo package --locked
      - name: Build project
        run: cargo build --release
